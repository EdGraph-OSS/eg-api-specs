  '/tenants/{tenantId}/enrollmentadmin/contacts/{id}/overrides':
    get:
      tags:
        - Enrollment Admin / Contacts
      summary: 'Reads a contact''s override history, newest first.'
      description: "<br>\r\n            Eventually consistent. A change reaches the log through Enrollment's outbox, so an entry can\r\n            be a few seconds behind a write that has already succeeded. Render the current value from the\r\n            contact itself and use this for what preceded it.\r\n            \r\n<br>\r\n            One route for both details, unlike the writes: this is a single ordered log and each entry\r\n            names its own detail, so splitting it would mean two requests to render one contact's\r\n            timeline and two page counts to reconcile.\r\n            "
      operationId: GetEnrollmentContactOverrides
      parameters:
        - name: tenantId
          in: path
          description: ''
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
            format: uuid
        - name: pageSize
          in: query
          description: ''
          schema:
            type: integer
            format: int32
            default: 20
        - name: pageIndex
          in: query
          description: ''
          schema:
            type: integer
            format: int32
            default: 0
        - name: studentId
          in: query
          description: Narrows to changes affecting one linked student.
          schema:
            type: string
            default: ''
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
