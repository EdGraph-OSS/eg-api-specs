openapi: 3.0.1
info:
  title: Enrollment Admin Api
  description: Enrollment Admin Api - v1.0
  version: v1.0
servers:
  - url: https://api.dev.edgraph.com/tenant
paths:
  '/tenants/{tenantId}/enrollmentadmin/schools/{schoolCode}/capacity':
    get:
      tags:
        - Enrollment Admin / Capacity
      summary: Searches Capacity for one school - one row per program x grade x school year.
      operationId: GetCapacity
      parameters:
        - name: tenantId
          in: path
          description: ''
          required: true
          schema:
            type: string
        - name: schoolCode
          in: path
          description: Required - a seat count is meaningless without a school.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: ''
          schema:
            type: integer
            format: int32
            default: 50
        - name: pageIndex
          in: query
          description: ''
          schema:
            type: integer
            format: int32
            default: 0
        - name: orderBy
          in: query
          description: ''
          schema:
            type: string
            default: ''
        - name: filter
          in: query
          description: ''
          schema:
            type: string
            default: ''
        - name: grade
          in: query
          description: Optional exact match.
          schema:
            type: string
            default: ''
        - name: search
          in: query
          description: Free-text match on program name/code.
          schema:
            type: string
            default: ''
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '200':
          description: The requested resource was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.HttpAggregators.Tenant.Api.Controllers.v1.ViewModels.Responses.EnrollmentAdmin.CapacityListItemDtoPaginatedItemsViewModel'
        '400':
          description: Bad Request. The request was invalid and cannot be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ValidationProblemDetails'
  '/tenants/{tenantId}/enrollmentadmin/contacts/{id}/email-override':
    delete:
      tags:
        - Enrollment Admin / Contacts
      summary: 'Removes a contact''s email override, letting the SIS value show through again.'
      description: The removal is itself recorded in the history - the superseded value stays recoverable.
      operationId: RemoveEnrollmentContactEmailOverride
      parameters:
        - name: tenantId
          in: path
          description: ''
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: query
          description: The student whose screen the removal was made from.
          schema:
            type: string
            default: ''
        - name: expectedVersion
          in: query
          description: The `lastUpdatedDateTime` this edit started from.
          schema:
            type: string
            default: ''
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '200':
          description: 'The override was removed, or there was none to remove.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.HttpAggregators.Tenant.Api.Controllers.v1.ViewModels.Responses.EnrollmentAdmin.ContactOverrideResultDto'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
        '412':
          description: The contact changed while it was being edited; the write was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdGraph.Common.Errors.Core.ProblemDetails'
    put:
      tags:
        - Enrollment Admin / Contacts
      summary: Overrides a contact's email address.
      description: "The override is an enrollment-local annotation over SIS data, not a writeback. The SIS value\r\nis kept and returned alongside it, and the correction keeps winning over later SIS imports\r\nuntil staff revisit it.\r\n<br>\r\nThe corrected value is shared by every student linked to the contact. `studentId` in the\r\nbody only records whose screen the edit came from.\r\n"
      operationId: OverrideEnrollmentContactEmail
      parameters:
        - name: tenantId
          in: path
          description: ''
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/EdGraph.HttpAggregators.Tenant.Api.Controllers.v1.ViewModels.Responses.EnrollmentAdmin.ContactEmailOverrideRequestDto'
          application/json:
            schema:
              $ref: '#/components/schemas/EdGraph.HttpAggregators.Tenant.Api.Controllers.v1.ViewModels.Responses.EnrollmentAdmin.ContactEmailOverrideRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/EdGraph.HttpAggregators.Tenant.Api.Controllers.v1.ViewModels.Responses.EnrollmentAdmin.ContactEmailOverrideRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/EdGraph.HttpAggregators.Tenant.Api.Controllers.v1.ViewModels.Responses.EnrollmentAdmin.ContactEmailOverrideRequestDto'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
