  '/tenants/{tenantId}/enrollmentadmin/contacts/{id}/unlock':
    post:
      tags:
        - Enrollment Admin / Contacts
      summary: 'Unlocks a contact''s sign-in, resetting exhausted parent-verification tries.'
      description: "Idempotent: unlocking an already-unlocked contact, or one with no rows at all, is a 200 with\r\n`resetCount: 0`, not an error."
      operationId: UnlockEnrollmentContactSignIn
      parameters:
        - name: tenantId
          in: path
          description: ''
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: ''
          required: true
